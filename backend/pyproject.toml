[project]
name = "renkkar-backend"
version = "0.1.0"
description = "RenkKar — peer-to-peer bike rental marketplace API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "filetype>=1.2",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

# This is an application, not a library — uv should not try to build/install it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic version scripts are auto-generated; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "E402"]  # asserts + test creds + late imports
"alembic/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
